name: Validate plugin

on:
  pull_request:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check manifests, versions and tool names
        run: python3 scripts/validate_plugin.py
